# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: EricTung1007/portfolio
  branch: main
  auth_methods: [token]

media_folder: public/media
public_folder: /media

collections:
  - name: weekly_en
    label: "The Weekly · English"
    label_singular: "English article"
    description: "The canonical edition. Publish here first. All subjects welcome: AI, engineering, nursing, travel, essays, and more."
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/#/writing/{{slug}}"
    fields:
      - { name: title, label: "Headline", widget: string }
      - { name: date, label: "Publication date", widget: datetime, type: date, format: "yyyy-MM-dd" }
      - { name: category, label: "Section", widget: select, options: ["Technology", "Research", "Minerva's Den", "Journal", "Ideas", "Life", "Elsewhere"], default: "Technology" }
      - { name: tags, label: "Tags", widget: list, required: false }
      - { name: publish_on, label: "Scheduled release date (UTC, optional) / 預約公開日", widget: datetime, type: date, format: "yyyy-MM-dd", required: false }\n      - { name: draft, label: "Keep as draft (not published)", widget: boolean, default: true, required: false }
      - { name: body, label: "Article", widget: richtext }
  - name: weekly_zh
    label: "週刊 · 繁體中文"
    label_singular: "繁中譯稿"
    description: "Create a translation with EXACTLY the same filename/slug as its English original. English entries remain visible until translated."
    folder: content/posts/zh
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/#/writing/{{slug}}"
    fields:
      - { name: title, label: "繁體中文標題", widget: string }
      - { name: date, label: "日期（與英文原稿一致）", widget: datetime, type: date, format: "yyyy-MM-dd" }
      - { name: category, label: "欄目", widget: select, options: ["Technology", "Research", "Minerva's Den", "Journal", "Ideas", "Life", "Elsewhere"], default: "Technology" }
      - { name: tags, label: "標籤", widget: list, required: false }
      - { name: publish_on, label: "Scheduled release date (UTC, optional) / 預約公開日", widget: datetime, type: date, format: "yyyy-MM-dd", required: false }\n      - { name: draft, label: "暫存草稿（不公開）", widget: boolean, default: true, required: false }
      - { name: body, label: "繁體中文內文", widget: richtext }
