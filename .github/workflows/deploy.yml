name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *' # Daily 00:10 UTC; enables scheduled article releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-recovery"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install PDF and CJK font support
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -qq --no-install-recommends poppler-utils libreoffice-writer fonts-lato fonts-noto-cjk python3-docx
      - name: Generate English and Traditional Chinese CVs
        run: |
          /usr/bin/python3 scripts/build-cv.py
          test -s public/CV.pdf
          test -s public/CV_zh_TW.pdf
          for pdf in public/CV.pdf public/CV_zh_TW.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')"
            echo "$pdf: $pages page(s)"
            if [ "$pages" != "1" ]; then
              echo "::warning file=$pdf::Resume has $pages pages after LibreOffice conversion; generated PDF kept intact."
            fi
          done
      - run: npm ci
      - name: Build portfolio
        env:
          VITE_GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          VITE_GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
